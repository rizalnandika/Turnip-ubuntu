# Build Turnip 26.1.0 R4 untuk Ubuntu (DroidSpaces) — GitHub Actions
# Cross-compile: runner Ubuntu 24.04 x86_64 -> ARM64 Linux (glibc)
#
# CARA PAKAI:
#   1. Buat repo baru di GitHub (boleh repo kosong, misal: turnip-ubuntu-build).
#   2. Upload file ini ke repo itu, di path:
#      .github/workflows/build-turnip-ubuntu-26.1.0-r4.yml
#      (di GitHub web: Add file > Create new file, ketik path di atas)
#   3. Buka tab Actions di repo itu > pilih "Build Turnip Ubuntu 26.1.0 R4"
#      > Run workflow > Run workflow.
#   4. Tunggu sampai selesai (perkiraan 20-40 menit, jalan di background,
#      tab boleh ditutup). Kalau sudah hijau, buka run itu, scroll ke bawah
#      ke bagian Artifacts, download "Turnip-Ubuntu-26.1.0-R4-aarch64".
#   5. Di Ubuntu DroidSpaces:
#      unzip Turnip-Ubuntu-26.1.0-R4-aarch64.zip -d $HOME/
#      VK_ICD_FILENAMES=$HOME/turnip-26.1.0/share/vulkan/icd.d/freedreno_icd.aarch64.json \
#        vulkaninfo --summary | grep -i -E 'driverName|driverInfo|deviceName|apiVersion'
#
# Mesa yang dipakai = commit yang sama dengan Turnip 26.1.0 R4 asli:
#   1e1d8931c7de6316b2c7b4c2c20e370079c23402
#   "freedreno: Reduce advertised memory", 2026-03-01
#   strings di .so R4 asli: "Mesa 26.1.0-devel (git-1e1d8931c7)"
name: Build Turnip Ubuntu 26.1.0 R4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MESA_COMMIT: 1e1d8931c7de6316b2c7b4c2c20e370079c23402
      PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
      PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
      PKG_CONFIG_SYSROOT_DIR: /
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Batasi repo bawaan ke amd64, tambah repo ARM64
        run: |
          CODENAME="$(lsb_release -cs)"
          echo "Codename: $CODENAME"
          for f in /etc/apt/sources.list.d/*.sources; do
            if [ -f "$f" ] && ! grep -q "^Architectures:" "$f"; then
              echo "patch $f"
              sudo sed -i '/^Types:/a Architectures: amd64' "$f"
            fi
          done
          sudo dpkg --add-architecture arm64 || true
          cat <<EOF | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $CODENAME main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $CODENAME-updates main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $CODENAME-security main universe
          EOF
          sudo apt-get update || true

      - name: Install host tools
        run: |
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build build-essential git python3-pip pkg-config \
            flex bison python3-mako python3-yaml \
            glslang-tools libglvnd-dev libwayland-bin
          meson --version
          ninja --version
          command -v glslangValidator

      - name: Install cross toolchain
        run: |
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
          aarch64-linux-gnu-gcc --version | head -1
          sudo apt-get install -y pkg-config-aarch64-linux-gnu || {
            cat <<'WRAPPER' | sudo tee /usr/bin/aarch64-linux-gnu-pkg-config >/dev/null
          #!/bin/sh
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/
          exec /usr/bin/pkg-config "$@"
          WRAPPER
            sudo chmod +x /usr/bin/aarch64-linux-gnu-pkg-config
          }
          ls -l /usr/bin/aarch64-linux-gnu-pkg-config

      - name: Install library ARM64
        run: |
          sudo apt-get install -y --no-install-recommends \
            libdrm-dev:arm64 libwayland-dev:arm64 wayland-protocols \
            libdisplay-info-dev:arm64 libudev-dev:arm64 libxrandr-dev:arm64 \
            libvulkan-dev:arm64 libegl-dev:arm64 libgbm-dev:arm64 \
            libglvnd-dev:arm64 \
            libx11-dev:arm64 libxext-dev:arm64 libxdamage-dev:arm64 \
            libxfixes-dev:arm64 libxxf86vm-dev:arm64 \
            libxcb-glx0-dev:arm64 libxcb-dri2-0-dev:arm64 libxcb-dri3-dev:arm64 \
            libxcb-present-dev:arm64 libxcb-randr0-dev:arm64 libxshmfence-dev:arm64 \
            libelf-dev:arm64 libexpat1-dev:arm64 libzstd-dev:arm64 zlib1g-dev:arm64
          aarch64-linux-gnu-pkg-config --modversion libdrm
          aarch64-linux-gnu-pkg-config --modversion libdisplay-info

      - name: Download Mesa (tarball, commit R4)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/turnip-build"
          cd "$GITHUB_WORKSPACE/turnip-build"
          curl -L --fail -o mesa.tar.gz "https://gitlab.freedesktop.org/mesa/mesa/-/archive/${MESA_COMMIT}/mesa-${MESA_COMMIT}.tar.gz"
          ls -lh mesa.tar.gz
          tar xzf mesa.tar.gz
          mv "mesa-${MESA_COMMIT}" mesa
          cd mesa
          cat VERSION || true

      - name: Meson setup (cross aarch64)
        working-directory: turnip-build/mesa
        run: |
          cat > ../aarch64-linux-gnu.txt <<'EOF'
          [binaries]
          ar = 'aarch64-linux-gnu-ar'
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          strip = 'aarch64-linux-gnu-strip'
          pkg-config = 'aarch64-linux-gnu-pkg-config'
          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          [properties]
          pkg_config_libdir = '/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig'
          sys_root = '/'
          EOF
          cat ../aarch64-linux-gnu.txt
          meson setup build \
            --cross-file ../aarch64-linux-gnu.txt \
            --prefix "$GITHUB_WORKSPACE/turnip-26.1.0" \
            -Dbuildtype=release \
            -Dplatforms=x11,wayland \
            -Dgallium-drivers=freedreno \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Degl=enabled \
            -Dglx=dri \
            -Dgbm=enabled \
            -Dopengl=true \
            -Dgles1=enabled \
            -Dgles2=enabled \
            -Dshared-glapi=enabled \
            -Dvulkan-beta=true \
            -Dllvm=disabled \
            -Dzstd=enabled \
            -Dwerror=false \
            --force-fallback-for=spirv-tools,spirv-headers

      - name: Ninja build + install
        working-directory: turnip-build/mesa
        run: |
          ninja -C build -j"$(nproc)"
          ninja -C build install

      - name: Verifikasi hasil
        run: |
          LIB="$(find "$GITHUB_WORKSPACE/turnip-26.1.0" -name 'libvulkan_freedreno.so' | head -1)"
          echo "Lib: $LIB"
          file "$LIB"
          strings "$LIB" | grep -m1 "26.1.0-devel"
          find "$GITHUB_WORKSPACE/turnip-26.1.0" -name '*freedreno*.json'
          cat "$(find "$GITHUB_WORKSPACE/turnip-26.1.0" -name '*freedreno*.json' | head -1)"

      - name: Zip hasil
        run: |
          cd "$GITHUB_WORKSPACE"
          zip -r Turnip-Ubuntu-26.1.0-R4-aarch64.zip turnip-26.1.0
          ls -lh Turnip-Ubuntu-26.1.0-R4-aarch64.zip
          unzip -l Turnip-Ubuntu-26.1.0-R4-aarch64.zip | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Ubuntu-26.1.0-R4-aarch64
          path: Turnip-Ubuntu-26.1.0-R4-aarch64.zip
          retention-days: 90
          
